<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Is there an Indian festival going on now?</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f9fafb;
      text-align: center;
    }
    .date {
      font-size: 1.2rem;
      color: #6b7280;
      margin-bottom: 1rem;
    }
    .answer {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
    }
    .festival-name {
      margin-top: 1.5rem;
      font-size: 1.5rem;
      color: #374151;
    }
  </style>
</head>
<body>

  <div class="date" id="todayDate">Loading...</div>
  <div class="answer" id="answer">...</div>
  <div class="festival-name" id="festivalName"></div>

  <script>
    // Major Indian Gazetted & National Holidays (2026)
    const festivals = {
      "2026-01-26": "Republic Day",
      "2026-03-03": "Holi",
      "2026-03-20": "Eid ul-Fitr",
      "2026-04-03": "Good Friday",
      "2026-05-27": "Bakrid / Eid al-Adha",
      "2026-08-15": "Independence Day",
      "2026-08-26": "Milad un-Nabi",
      "2026-09-04": "Janmashtami",
      "2026-10-02": "Gandhi Jayanti",
      "2026-10-20": "Dussehra / Vijayadashami",
      "2026-11-08": "Diwali / Deepavali",
      "2026-11-24": "Guru Nanak Jayanti",
      "2026-12-25": "Christmas Day"
    };

    function checkFestival() {
      const now = new Date();
      
      // Convert display date to IST (India Standard Time)
      const options = { timeZone: 'Asia/Kolkata', year: 'numeric', month: 'long', day: 'numeric' };
      const formattedDate = now.toLocaleDateString('en-IN', options);
      document.getElementById('todayDate').innerText = `Today in India: ${formattedDate}`;

      // Get YYYY-MM-DD in IST timezone
      const istDate = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
      const yyyy = istDate.getFullYear();
      const mm = String(istDate.getMonth() + 1).padStart(2, '0');
      const dd = String(istDate.getDate()).padStart(2, '0');
      const todayKey = `${yyyy}-${mm}-${dd}`;

      const festival = festivals[todayKey];

      if (festival) {
        document.getElementById('answer').innerText = 'YES';
        document.getElementById('answer').style.color = '#16a34a'; // Green
        document.getElementById('festivalName').innerText = `🎉 ${festival}`;
      } else {
        document.getElementById('answer').innerText = 'NO';
        document.getElementById('answer').style.color = '#dc2626'; // Red
        document.getElementById('festivalName').innerText = '';
      }
    }

    checkFestival();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is There an Indian Festival Going On Now?</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            color: #333;
        }
        .date-display {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 10px;
        }
        .status {
            font-size: 8rem;
            font-weight: bold;
            margin: 0;
            line-height: 1;
        }
        .yes {
            color: #2e7d32;
        }
        .no {
            color: #d32f2f;
        }
        .prediction {
            margin-top: 40px;
            font-size: 0.85rem;
            font-style: italic;
            color: #333;
            text-align: center;
            max-width: 600px;
            padding: 0 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="date-display" id="dateDisplay"></div>
    <h1 class="status" id="statusDisplay"></h1>
    <div class="prediction" id="predictionDisplay"></div>

    <script>
        // Dictionary of festivals with date keys (YYYY-MM-DD) and festival names
        const festivals = {
"2026-01-13": "Lohri",
    "2026-01-14": "Makar Sankranti / Pongal",
    "2026-01-23": "Vasant Panchami",
    "2026-01-26": "Republic Day",
    "2026-02-15": "Maha Shivaratri",
    "2026-03-03": "Holika Dahan",
    "2026-03-04": "Holi",
    "2026-03-19": "Ugadi / Gudi Padwa",
    "2026-03-21": "Eid-ul-Fitr",
    "2026-03-26": "Rama Navami",
    "2026-03-31": "Mahavir Jayanti",
    "2026-04-03": "Good Friday",
    "2026-04-05": "Easter",
    "2026-04-14": "Baisakhi / Vishu / Tamil New Year",
    "2026-04-15": "Bengali New Year / Bohag Bihu",
    "2026-04-19": "Akshaya Tritiya",
    "2026-05-01": "Buddha Purnima",
    "2026-05-27": "Bakrid (Eid-ul-Adha)",
    "2026-06-26": "Muharram",
    "2026-07-16": "Jagannath Rath Yatra",
    "2026-07-29": "Guru Purnima",
    "2026-08-15": "Independence Day",
    "2026-08-17": "Nag Panchami",
    "2026-08-26": "Onam",
    "2026-08-28": "Raksha Bandhan",
    "2026-09-04": "Krishna Janmashtami",
    "2026-09-14": "Ganesh Chaturthi",
    "2026-10-02": "Gandhi Jayanti",
    "2026-10-11": "Sharad Navratri Begins",
    "2026-10-18": "Durga Puja Ashtami",
    "2026-10-19": "Maha Navami",
    "2026-10-20": "Dussehra",
    "2026-10-25": "Sharad Purnima",
    "2026-10-29": "Karwa Chauth",
    "2026-11-01": "Ahoi Ashtami",
    "2026-11-06": "Dhanteras",
    "2026-11-07": "Choti Diwali",
    "2026-11-08": "Diwali",
    "2026-11-09": "Govardhan Puja",
    "2026-11-11": "Bhai Dooj",
    "2026-11-15": "Chhath Puja",
    "2026-11-24": "Guru Nanak Jayanti",
    "2026-12-25": "Christmas",

    // 2027 Festivals
    "2027-01-15": "Makar Sankranti / Pongal",
    "2027-01-26": "Republic Day",
    "2027-02-11": "Vasant Panchami",
    "2027-03-06": "Maha Shivaratri",
    "2027-03-10": "Eid-ul-Fitr",
    "2027-03-21": "Holika Dahan",
    "2027-03-22": "Holi",
    "2027-03-26": "Good Friday",
    "2027-03-28": "Easter",
    "2027-04-07": "Ugadi / Gudi Padwa",
    "2027-04-14": "Vaisakhi / Vishu / Tamil New Year",
    "2027-04-15": "Ramanavami / Bengali New Year",
    "2027-04-20": "Hanuman Jayanti / Mahavir Jayanti",
    "2027-05-09": "Akshaya Tritiya",
    "2027-05-17": "Bakrid (Eid-ul-Adha)",
    "2027-05-20": "Buddha Purnima",
    "2027-06-16": "Muharram",
    "2027-07-05": "Jagannath Rath Yatra",
    "2027-07-18": "Guru Purnima",
    "2027-08-06": "Nag Panchami",
    "2027-08-15": "Independence Day",
    "2027-08-17": "Raksha Bandhan",
    "2027-08-25": "Krishna Janmashtami",
    "2027-09-04": "Ganesh Chaturthi",
    "2027-09-12": "Onam",
    "2027-09-30": "Navratri Begins",
    "2027-10-02": "Gandhi Jayanti",
    "2027-10-08": "Maha Navami",
    "2027-10-09": "Dussehra",
    "2027-10-14": "Sharad Purnima",
    "2027-10-18": "Karwa Chauth",
    "2027-10-27": "Dhanteras",
    "2027-10-29": "Diwali",
    "2027-10-31": "Bhai Dooj",
    "2027-11-04": "Chhath Puja",
    "2027-11-14": "Guru Nanak Jayanti",
    "2027-12-25": "Christmas"
        };

        const today = new Date();
        const formatDateString = (d) => d.toISOString().split('T')[0];
        const todayStr = formatDateString(today);

        // Format today's date for display
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('dateDisplay').textContent = `Today in India: ${today.toLocaleDateString('en-GB', options)}`;

        // Check if today is a festival
        const isTodayFestival = Boolean(festivals[todayStr]);
        const statusEl = document.getElementById('statusDisplay');
        if (isTodayFestival) {
            statusEl.textContent = "YES";
            statusEl.className = "status yes";
        } else {
            statusEl.textContent = "NO";
            statusEl.className = "status no";
        }

        // Check the next 7 days
        let upcomingFestivals = [];
        for (let i = 1; i <= 7; i++) {
            const nextDate = new Date();
            nextDate.setDate(today.getDate() + i);
            const nextStr = formatDateString(nextDate);
            
            if (festivals[nextStr]) {
                const formattedDate = nextDate.toLocaleDateString('en-GB', options);
                const festivalName = festivals[nextStr];
                upcomingFestivals.push(`${formattedDate} (${festivalName})`);
            }
        }

        // Display prediction below with line break (<br>)
        const predictionEl = document.getElementById('predictionDisplay');
        if (upcomingFestivals.length > 0) {
            predictionEl.innerHTML = `And in the next 7 days,<br>there are festivals: ${upcomingFestivals.join(', ')}.`;
        } else {
            predictionEl.innerHTML = "And in the next 7 days,<br>there are no festivals.";
        }
    </script>
</body>
</html>
